name: Deploy Cloudflare script gateway

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to publish the Worker
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-script-gateway-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      JUNKIE_API_KEY: ${{ secrets.JUNKIE_API_KEY }}
      GH_SCRIPT_TOKEN: ${{ secrets.GH_SCRIPT_TOKEN }}
    steps:
      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID JUNKIE_API_KEY GH_SCRIPT_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              exit 1
            fi
          done

      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.153.0

      - name: Deploy Worker code
        run: wrangler deploy --config cloudflare/script-gateway/wrangler.toml

      - name: Set Worker secrets
        shell: bash
        run: |
          set -euo pipefail
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({
            JUNKIE_API_KEY: process.env.JUNKIE_API_KEY,
            GH_SCRIPT_TOKEN: process.env.GH_SCRIPT_TOKEN
          }), { mode: 0o600 })' "$secret_file"
          wrangler secret bulk "$secret_file" --config cloudflare/script-gateway/wrangler.toml
